<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g-gold-v" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#f0e6d3"/>
    <stop offset="45%"  stop-color="#c8aa6e"/>
    <stop offset="100%" stop-color="#5c3d11"/>
  </linearGradient>
  <linearGradient id="g-gold-h" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#5c3d11"/>
    <stop offset="30%"  stop-color="#c8aa6e"/>
    <stop offset="50%"  stop-color="#f0e6d3"/>
    <stop offset="70%"  stop-color="#c8aa6e"/>
    <stop offset="100%" stop-color="#5c3d11"/>
  </linearGradient>
  <linearGradient id="g-crystal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#a8f0ff"/>
    <stop offset="40%"  stop-color="#0bc4e3"/>
    <stop offset="100%" stop-color="#045f75"/>
  </linearGradient>
  <linearGradient id="g-crystal2" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e0faff"/>
    <stop offset="60%"  stop-color="#0bc4e3"/>
    <stop offset="100%" stop-color="#023040"/>
  </linearGradient>
  <linearGradient id="g-dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#0d1f2d"/>
    <stop offset="100%" stop-color="#010a13"/>
  </linearGradient>
  <filter id="f-glow-blue" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-glow-gold" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="hex-clip">
    <polygon points="340,18 380,40 380,84 340,106 300,84 300,40"/>
  </clipPath>
</defs>

<!-- ══ FONDO NEGRO TOTAL ══ -->
<rect width="680" height="260" fill="#010a13"/>

<!-- Textura sutil de puntos -->
<g opacity="0.06">
  <circle cx="100" cy="50"  r="1" fill="#c8aa6e"/>
  <circle cx="160" cy="80"  r="1" fill="#c8aa6e"/>
  <circle cx="60"  cy="130" r="1" fill="#c8aa6e"/>
  <circle cx="200" cy="160" r="1" fill="#c8aa6e"/>
  <circle cx="120" cy="200" r="1" fill="#c8aa6e"/>
  <circle cx="580" cy="50"  r="1" fill="#c8aa6e"/>
  <circle cx="520" cy="80"  r="1" fill="#c8aa6e"/>
  <circle cx="620" cy="130" r="1" fill="#c8aa6e"/>
  <circle cx="480" cy="160" r="1" fill="#c8aa6e"/>
  <circle cx="560" cy="200" r="1" fill="#c8aa6e"/>
  <circle cx="340" cy="30"  r="1" fill="#c8aa6e"/>
  <circle cx="280" cy="220" r="1" fill="#c8aa6e"/>
  <circle cx="400" cy="220" r="1" fill="#c8aa6e"/>
</g>

<!-- ══ HEXÁGONO EXTERIOR (marco dorado) ══ -->
<polygon points="340,14 386,38 386,88 340,112 294,88 294,38"
  fill="none" stroke="url(#g-gold-v)" stroke-width="1.5" opacity="0.9"/>

<!-- Hexágono exterior grande decorativo -->
<polygon points="340,8 394,34 394,94 340,120 286,94 286,34"
  fill="none" stroke="#c8aa6e" stroke-width="0.5" opacity="0.3"/>

<!-- ══ HEXÁGONO RELLENO (fondo del cristal) ══ -->
<polygon points="340,18 380,40 380,84 340,106 300,84 300,40"
  fill="#041820"/>

<!-- ══ CRISTAL HEXTECH — forma principal ══ -->
<!-- Sombra del cristal -->
<polygon points="340,28 370,44 370,78 340,94 310,78 310,44"
  fill="#023040" opacity="0.8"/>

<!-- Cristal central -->
<polygon points="340,26 372,43 372,80 340,97 308,80 308,43"
  fill="url(#g-crystal)"/>

<!-- Faceta superior izquierda (más clara) -->
<polygon points="340,26 308,43 340,62" fill="#7ee8f8" opacity="0.5"/>

<!-- Faceta superior derecha -->
<polygon points="340,26 372,43 340,62" fill="#0bc4e3" opacity="0.3"/>

<!-- Faceta inferior -->
<polygon points="308,80 372,80 340,97" fill="#023040" opacity="0.6"/>

<!-- Línea central del cristal -->
<line x1="340" y1="26" x2="340" y2="97" stroke="#e0faff" stroke-width="0.8" opacity="0.4"/>
<line x1="308" y1="43" x2="372" y2="80" stroke="#e0faff" stroke-width="0.5" opacity="0.25"/>
<line x1="372" y1="43" x2="308" y2="80" stroke="#e0faff" stroke-width="0.5" opacity="0.25"/>

<!-- Destello superior del cristal -->
<polygon points="340,28 356,36 340,46 324,36" fill="#e0faff" opacity="0.7"/>
<circle cx="336" cy="33" r="3" fill="#ffffff" opacity="0.9"/>

<!-- Borde brillante del cristal -->
<polygon points="340,26 372,43 372,80 340,97 308,80 308,43"
  fill="none" stroke="#a8f0ff" stroke-width="1" opacity="0.6"/>

<!-- ══ ESQUINAS ORNAMENTALES DEL HEX ══ -->
<!-- Punta superior -->
<line x1="340" y1="2"  x2="340" y2="14" stroke="#c8aa6e" stroke-width="1.5" opacity="0.8"/>
<!-- Punta inferior -->
<line x1="340" y1="120" x2="340" y2="132" stroke="#c8aa6e" stroke-width="1.5" opacity="0.8"/>
<!-- Diagonal sup-der -->
<line x1="392" y1="32" x2="382" y2="36" stroke="#c8aa6e" stroke-width="1.2" opacity="0.7"/>
<!-- Diagonal inf-der -->
<line x1="392" y1="96" x2="382" y2="92" stroke="#c8aa6e" stroke-width="1.2" opacity="0.7"/>
<!-- Diagonal sup-izq -->
<line x1="288" y1="32" x2="298" y2="36" stroke="#c8aa6e" stroke-width="1.2" opacity="0.7"/>
<!-- Diagonal inf-izq -->
<line x1="288" y1="96" x2="298" y2="92" stroke="#c8aa6e" stroke-width="1.2" opacity="0.7"/>

<!-- Pequeños rombos en las puntas -->
<polygon points="340,2 343,6 340,10 337,6"   fill="#c8aa6e" opacity="0.9"/>
<polygon points="340,124 343,128 340,132 337,128" fill="#c8aa6e" opacity="0.9"/>

<!-- ══ LÍNEAS LATERALES DECORATIVAS ══ -->
<!-- Izquierda -->
<line x1="42"  y1="67" x2="272" y2="67" stroke="#c8aa6e" stroke-width="0.6" opacity="0.25"/>
<line x1="42"  y1="67" x2="272" y2="67" stroke="url(#g-gold-h)" stroke-width="0.6" opacity="0.3"/>

<!-- Nodos decorativos izquierda -->
<polygon points="272,67 264,63 266,67 264,71" fill="#c8aa6e" opacity="0.6"/>
<polygon points="254,67 248,64 250,67 248,70" fill="#c8aa6e" opacity="0.4"/>
<circle cx="80"  cy="67" r="1.5" fill="#c8aa6e" opacity="0.4"/>
<circle cx="120" cy="67" r="1.5" fill="#c8aa6e" opacity="0.3"/>
<circle cx="160" cy="67" r="1.5" fill="#c8aa6e" opacity="0.3"/>
<circle cx="200" cy="67" r="1.5" fill="#c8aa6e" opacity="0.3"/>

<!-- Derecha -->
<line x1="408" y1="67" x2="638" y2="67" stroke="url(#g-gold-h)" stroke-width="0.6" opacity="0.3"/>
<polygon points="408,67 416,63 414,67 416,71" fill="#c8aa6e" opacity="0.6"/>
<polygon points="426,67 432,64 430,67 432,70" fill="#c8aa6e" opacity="0.4"/>
<circle cx="600" cy="67" r="1.5" fill="#c8aa6e" opacity="0.4"/>
<circle cx="560" cy="67" r="1.5" fill="#c8aa6e" opacity="0.3"/>
<circle cx="520" cy="67" r="1.5" fill="#c8aa6e" opacity="0.3"/>
<circle cx="480" cy="67" r="1.5" fill="#c8aa6e" opacity="0.3"/>

<!-- ══ TEXTO PRINCIPAL ══ -->
<!-- Sombra del texto (capa de profundidad) -->
<text x="342" y="176"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="68"
  font-weight="700"
  fill="#000"
  letter-spacing="4"
  opacity="0.5">LOLpedia</text>

<!-- Texto principal con gradiente dorado -->
<text x="340" y="174"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="68"
  font-weight="700"
  fill="url(#g-gold-h)"
  letter-spacing="4">LOLpedia</text>

<!-- Brillo sutil sobre el texto -->
<text x="340" y="174"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="68"
  font-weight="700"
  fill="#f0e6d3"
  letter-spacing="4"
  opacity="0.12">LOLpedia</text>

<!-- ══ LÍNEA DIVISORA BAJO EL TÍTULO ══ -->
<line x1="180" y1="185" x2="500" y2="185" stroke="url(#g-gold-h)" stroke-width="0.8" opacity="0.5"/>
<polygon points="340,182 344,185 340,188 336,185" fill="#c8aa6e" opacity="0.7"/>

<!-- ══ SUBTÍTULO ══ -->
<text x="340" y="208"
  text-anchor="middle"
  font-family="Georgia, 'Times New Roman', serif"
  font-size="11"
  font-weight="400"
  fill="#a38d50"
  letter-spacing="9">ENCICLOPEDIA DE CAMPEONES</text>

<!-- ══ PUNTOS DE ESQUINA GLOBALES ══ -->
<rect x="42"  y="18"  width="8" height="1" fill="#c8aa6e" opacity="0.4"/>
<rect x="42"  y="18"  width="1" height="8" fill="#c8aa6e" opacity="0.4"/>
<rect x="630" y="18"  width="8" height="1" fill="#c8aa6e" opacity="0.4"/>
<rect x="637" y="18"  width="1" height="8" fill="#c8aa6e" opacity="0.4"/>
<rect x="42"  y="234" width="8" height="1" fill="#c8aa6e" opacity="0.4"/>
<rect x="42"  y="227" width="1" height="8" fill="#c8aa6e" opacity="0.4"/>
<rect x="630" y="234" width="8" height="1" fill="#c8aa6e" opacity="0.4"/>
<rect x="637" y="227" width="1" height="8" fill="#c8aa6e" opacity="0.4"/>
</svg>